[project]
name = "llama-index-examples"
version = "1.0.0"
description = "LlamaIndex framework examples"
requires-python = ">=3.12"
dependencies = [
    "llama-index>=0.14.23",
    "llama-index-core>=0.14.23",
    "llama-index-llms-openai>=0.3.0",
    "llama-index-embeddings-openai>=0.3.0",
    # llama-index 0.14.23 slimmed its transitive deps and no longer pulls this in,
    # but 10_agentic_rag.py loads a PDF through SimpleDirectoryReader.
    "llama-index-readers-file>=0.5.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "openai>=1.60.0",
    "llama-index-tools-google>=0.6.2",
    "llama-index-tools-mcp>=0.4.0",
    "llama-index-workflows>=2.22.0",
    "llama-index-utils-workflow>=0.11.0",
    "llama-agents-server>=0.6.0",
    "mcp>=1.9.0",
]
