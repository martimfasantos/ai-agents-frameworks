name: pr-labels

# Labels every PR by review size (size:XXS..size:XL) and by the framework folders
# it touches (framework:<folder>). pull_request_target gives the token write access
# on fork PRs too; it runs the base branch's script and only reads the PR's file
# list through the API, so no code from the PR is executed.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    # "edited" also fires on title/body edits; only a base change alters the diff
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply size and framework labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/label_pr.sh "$PR_NUMBER"
